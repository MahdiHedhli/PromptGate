profile: legal
mode: enforce
logging: {raw_prompts: false, redacted_prompts: true, findings: true}
detectors: {regex: true, secrets: true, privacy_filter: optional, normalization: true, sample_dlp_imports: true}
actions: {private_email: tokenize, private_phone: mask, private_person: tokenize, secret: block, api_key: block, internal_domain: tokenize}
allowlist: []
rules:
  - id: matter_number
    type: regex
    pattern: "\\bMATTER-[0-9]{4,10}\\b"
    category: matter_number
    action: tokenize
    severity: high
