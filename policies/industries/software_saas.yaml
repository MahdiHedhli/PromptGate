profile: software_saas
mode: enforce
logging: {raw_prompts: false, redacted_prompts: true, findings: true}
detectors: {regex: true, secrets: true, privacy_filter: optional, normalization: true, sample_dlp_imports: true}
actions: {private_email: tokenize, private_phone: mask, secret: block, api_key: block, jwt: block, database_url: block, internal_domain: tokenize, ip_address: tokenize, file_path: mask}
allowlist: []
rules:
  - id: saas_tenant_id
    type: regex
    pattern: "\\btenant_[a-z0-9]{8,}\\b"
    category: tenant_id
    action: tokenize
    severity: medium
